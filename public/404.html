<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FediWings</title>
    <script>
      (() => {
        const segments = location.pathname.split('/');
        const first = segments[1] ?? '';
        if (first.toLowerCase() === 'fediwings' && first !== 'fediwings') {
          segments[1] = 'fediwings';
          location.replace(
            `${location.origin}${segments.join('/')}${location.search}${location.hash}`,
          );
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/fediwings/" />
  </head>
  <body></body>
</html>
